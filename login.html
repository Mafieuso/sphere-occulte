<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Sphère Occulte</title>
<link rel="stylesheet" href="styles.css">
<style>
.login-bg {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 30% 60%, rgba(80,0,0,.25) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 30%, rgba(60,30,0,.2) 0%, transparent 60%),
                var(--bg);
}
.login-box {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    padding: 1rem;
}
.login-logo {
    text-align: center; margin-bottom: 1.75rem;
}
.login-logo h1 {
    font-size: 1.5rem; color: var(--gold);
    letter-spacing: .2em; margin-bottom: .25rem;
}
.login-logo p { color: var(--text-dim); font-size: .82rem; letter-spacing: .1em; }
.login-card { padding: 1.75rem; }
.tab-switch {
    display: flex; gap: 0;
    background: var(--bg3);
    border-radius: 6px; padding: 3px;
    margin-bottom: 1.5rem;
}
.tab-switch button {
    flex: 1; background: none; border: none; color: var(--text-dim);
    padding: .5rem; border-radius: 4px; cursor: pointer;
    font-family: 'Karla', sans-serif; font-size: .88rem; transition: all .2s;
}
.tab-switch button.active { background: var(--bg2); color: var(--text); }
.steam-btn {
    display: flex; align-items: center; justify-content: center; gap: .6rem;
    width: 100%; padding: .8rem 1.2rem; border-radius: 9px;
    background: #171a21; color: #fff; border: 1px solid rgba(255,255,255,.12);
    font-family: 'Karla', sans-serif; font-size: .95rem; font-weight: 600;
    cursor: pointer; transition: all .2s; text-decoration: none;
}
.steam-btn:hover { background: #2a3f5f; border-color: rgba(255,255,255,.25); color: #fff; }
.steam-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
.login-note { font-size: .78rem; color: var(--text-muted); text-align: center; margin-top: 1.1rem; line-height: 1.6; }
</style>
</head>
<body>
<div class="login-bg"></div>
<div class="full-center">
<div class="login-box">
    <div class="login-logo">
        <h1>⬡ SPHÈRE OCCULTE ⬡</h1>
        <p>PORTAIL D'ACCÈS</p>
    </div>
    <div class="card login-card">
        <div id="alert-box"></div>

        <a href="https://us-central1-sphere-occulte.cloudfunctions.net/steamLogin" class="steam-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.605 0 11.979 0M7.54 18.21l-1.473-.61c.262.539.714.994 1.314 1.246 1.297.539 2.793-.076 3.332-1.375.263-.63.264-1.319.005-1.949s-.75-1.121-1.377-1.383c-.624-.26-1.29-.249-1.878-.03l1.523.63c.956.4 1.409 1.5 1.009 2.456-.397.957-1.497 1.41-2.454 1.012M17.61 8.91c0-1.662-1.353-3.015-3.015-3.015-1.665 0-3.015 1.353-3.015 3.015 0 1.665 1.35 3.015 3.015 3.015 1.663 0 3.015-1.35 3.015-3.015m-5.273-.005c0-1.252 1.013-2.266 2.265-2.266 1.249 0 2.264 1.014 2.264 2.266 0 1.251-1.015 2.264-2.264 2.264-1.253 0-2.265-1.013-2.265-2.264"/></svg>
            Se connecter avec Steam
        </a>

        <p class="login-note">
            Votre compte est retrouvé automatiquement via votre SteamID.<br>
            Première connexion depuis le passage à Steam ? Ça marche aussi — vous retrouverez votre profil existant.
        </p>
    </div>
    <p style="text-align:center; margin-top:1rem">
        <a href="index.html">← Retour au classement</a>
    </p>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
function showAlert(msg, type = 'danger') {
    document.getElementById('alert-box').innerHTML =
        `<div class="alert alert-${type}">${msg}</div>`;
}
function clearAlert() { document.getElementById('alert-box').innerHTML = ''; }

// Message d'erreur renvoyé par le callback Steam (ex: login.html?erreur=1)
if (new URLSearchParams(window.location.search).get('erreur')) {
    showAlert("La connexion Steam a échoué. Réessayez.");
}

// Redirige si déjà connecté
auth.onAuthStateChanged(async user => {
    if (!user) return;
    const doc = await db.collection('membres').doc(user.uid).get();
    if (!doc.exists) return;
    const role = doc.data().role;
    window.location.href = (role === 'haut_grade' || role === 'admin') ? 'admin.html' : 'rapport.html';
});
</script>
</body>
</html>
